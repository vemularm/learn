name: CI Pipeline with Security & Qauality Scans

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  buildandtest:
    runs-on: ubuntu-latest

    steps:
      # checkout code from the dev branch
      - name: checkout code
        uses: actions/checkout@v5.0.0

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: install dependencies
        run: npm install

      - name: run tests
        run: |
          mkdir -p test-results
          npm test -- --reporter mocha-junit-reporter --reporter-options mochaFile=./test-results/results.xml
